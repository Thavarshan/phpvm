name: Release Testing

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to test'
        required: true
        default: 'main'

jobs:
  # Test release functionality
  release-test:
    name: Release Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Release Version
        run: |
          echo "=== Testing Release Version ==="
          
          chmod +x ./phpvm.sh
          
          # Check version matches expected format
          VERSION_OUTPUT=$(./phpvm.sh version)
          echo "Version output: $VERSION_OUTPUT"
          
          if echo "$VERSION_OUTPUT" | grep -q "phpvm version"; then
            echo "✅ Version output format is correct"
          else
            echo "❌ Version output format is incorrect"
            exit 1
          fi

      - name: Test All Core Commands
        run: |
          echo "=== Testing All Core Commands ==="
          
          # Test each command
          ./phpvm.sh version
          ./phpvm.sh help
          ./phpvm.sh list
          
          echo "✅ All core commands work"

      - name: Test Installation from Release
        if: github.event_name == 'release'
        run: |
          echo "=== Testing Installation from Release ==="
          
          # Test installation from the release tag
          TAG_NAME="${{ github.event.release.tag_name }}"
          echo "Testing installation from tag: $TAG_NAME"
          
          # Create clean environment
          TEST_HOME=$(mktemp -d)
          export HOME="$TEST_HOME"
          export PHPVM_DIR="$TEST_HOME/.phpvm"
          
          cd "$TEST_HOME"
          
          # Install from release
          curl -o- "https://raw.githubusercontent.com/Thavarshan/phpvm/$TAG_NAME/install.sh" | bash
          
          # Verify installation
          if [ -f "$PHPVM_DIR/phpvm.sh" ]; then
            echo "✅ Release installation successful"
            "$PHPVM_DIR/phpvm.sh" version
          else
            echo "❌ Release installation failed"
            exit 1
          fi

  # Performance regression test
  performance-regression:
    name: Performance Regression Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Performance Baseline Test
        run: |
          echo "=== Performance Regression Test ==="
          
          chmod +x ./phpvm.sh
          
          # Test command execution speed
          echo "Testing version command speed:"
          time ./phpvm.sh version
          
          echo "Testing help command speed:"
          time ./phpvm.sh help
          
          echo "Testing list command speed:"
          time ./phpvm.sh list
          
          echo "✅ Performance regression test completed"

  # Documentation verification
  docs-verification:
    name: Documentation Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Documentation
        run: |
          echo "=== Documentation Verification ==="
          
          # Check that README mentions all commands
          chmod +x ./phpvm.sh
          
          # Get help output
          HELP_OUTPUT=$(./phpvm.sh help)
          
          # Check if README contains key commands
          if grep -q "phpvm version" README.MD; then
            echo "✅ README contains version command documentation"
          else
            echo "⚠️  README might be missing version command documentation"
          fi
          
          if grep -q "phpvm install" README.MD; then
            echo "✅ README contains install command documentation"
          else
            echo "❌ README missing install command documentation"
            exit 1
          fi
          
          echo "✅ Documentation verification completed"

  # Changelog verification
  changelog-verification:
    name: Changelog Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Changelog
        run: |
          echo "=== Changelog Verification ==="
          
          if [ -f CHANGELOG.md ]; then
            echo "✅ Changelog file exists"
            
            # Check if changelog has recent entries
            if grep -q "$(date +%Y)" CHANGELOG.md; then
              echo "✅ Changelog has current year entries"
            else
              echo "⚠️  Changelog might be outdated"
            fi
          else
            echo "❌ Changelog file missing"
            exit 1
          fi

  # Final release verification
  release-verification:
    name: Release Verification Summary
    runs-on: ubuntu-latest
    needs: [release-test, performance-regression, docs-verification, changelog-verification]
    if: always()

    steps:
      - name: Release Test Summary
        run: |
          echo "=== Release Verification Summary ==="
          echo "Release Test: ${{ needs.release-test.result }}"
          echo "Performance Test: ${{ needs.performance-regression.result }}"
          echo "Documentation Test: ${{ needs.docs-verification.result }}"
          echo "Changelog Test: ${{ needs.changelog-verification.result }}"
          
          if [[ "${{ needs.release-test.result }}" == "success" && 
                "${{ needs.performance-regression.result }}" == "success" && 
                "${{ needs.docs-verification.result }}" == "success" && 
                "${{ needs.changelog-verification.result }}" == "success" ]]; then
            echo "🎉 Release verification PASSED! Ready for release."
          else
            echo "❌ Release verification FAILED! Please review."
            exit 1
          fi
