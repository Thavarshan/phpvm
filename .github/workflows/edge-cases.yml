name: Cross-Platform Edge Cases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Test WSL-like environments
  wsl-simulation:
    name: WSL Simulation Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Simulate WSL Environment
        run: |
          # Create a more WSL-like environment
          export WSL_DISTRO_NAME="Ubuntu"
          export WSLENV="PATH/l"
          
          # Test bash shebang compatibility (important for v1.5.0)
          chmod +x ./phpvm.sh
          bash ./phpvm.sh version
          echo "✅ WSL simulation test passed"

      - name: Test Bash-specific Features
        run: |
          # Test bash arrays and other bash-specific features used in phpvm
          ./phpvm.sh test
          echo "✅ Bash-specific features work correctly"

  # Test different Linux distributions
  distro-compatibility:
    name: Linux Distribution Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container: 
          - 'ubuntu:20.04'
          - 'ubuntu:22.04'
          - 'debian:bullseye'
          - 'centos:8'

    container: ${{ matrix.container }}

    steps:
      - name: Install Dependencies
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y bash curl git
          elif command -v yum >/dev/null; then
            yum install -y bash curl git
          elif command -v dnf >/dev/null; then
            dnf install -y bash curl git
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Basic Functionality
        run: |
          chmod +x ./phpvm.sh
          ./phpvm.sh version
          ./phpvm.sh help
          echo "✅ Basic functionality works on $(cat /etc/os-release | head -1)"

  # Test Package Manager Detection
  package-manager-test:
    name: Package Manager Detection
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Package Manager Detection
        run: |
          chmod +x ./phpvm.sh
          
          # Test the detect_system function by checking what it detects
          echo "=== Package Manager Detection Test ==="
          
          # Create a test script to check detection
          cat > test_detection.sh << 'EOF'
          #!/bin/bash
          source ./phpvm.sh
          detect_system
          echo "Detected package manager: $PKG_MANAGER"
          echo "PHP binary path: $PHP_BIN_PATH"
          if [[ -n "$HOMEBREW_PREFIX" ]]; then
            echo "Homebrew prefix: $HOMEBREW_PREFIX"
          fi
          EOF
          
          chmod +x test_detection.sh
          ./test_detection.sh
          echo "✅ Package manager detection test completed"

  # Test Version Command Variations
  version-command-test:
    name: Version Command Variations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test All Version Command Formats
        run: |
          chmod +x ./phpvm.sh
          
          echo "=== Testing Version Command Variations ==="
          
          # Test all version command formats
          echo "Testing: phpvm version"
          ./phpvm.sh version
          
          echo -e "\nTesting: phpvm --version"
          ./phpvm.sh --version
          
          echo -e "\nTesting: phpvm -v"
          ./phpvm.sh -v
          
          # Verify all produce the same output
          output1=$(./phpvm.sh version | head -1)
          output2=$(./phpvm.sh --version | head -1)
          output3=$(./phpvm.sh -v | head -1)
          
          if [[ "$output1" == "$output2" && "$output2" == "$output3" ]]; then
            echo "✅ All version commands produce consistent output"
          else
            echo "❌ Version command outputs are inconsistent"
            exit 1
          fi

  # Test Error Handling Improvements
  error-handling-test:
    name: Error Handling Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Enhanced Error Handling
        run: |
          chmod +x ./phpvm.sh
          
          echo "=== Testing Enhanced Error Handling ==="
          
          # Test invalid commands
          if ./phpvm.sh invalid_command 2>/dev/null; then
            echo "❌ Should have failed on invalid command"
            exit 1
          else
            echo "✅ Correctly handles invalid commands"
          fi
          
          # Test missing version parameter
          if ./phpvm.sh use 2>/dev/null; then
            echo "❌ Should have failed on missing version"
            exit 1
          else
            echo "✅ Correctly handles missing version parameter"
          fi
          
          # Test invalid version
          if ./phpvm.sh use 999.999 2>/dev/null; then
            echo "❌ Should have failed on invalid version"
            exit 1
          else
            echo "✅ Correctly handles invalid version"
          fi

  # Test Homebrew Integration Edge Cases
  homebrew-edge-cases:
    name: Homebrew Edge Cases
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Homebrew Integration
        run: |
          chmod +x ./phpvm.sh
          
          echo "=== Testing Homebrew Edge Cases ==="
          
          # Test when no PHP versions are installed
          echo "Current PHP installations:"
          brew list | grep php || echo "No PHP installations found"
          
          # Test list command with no versions
          ./phpvm.sh list
          
          # Test system command
          ./phpvm.sh system || echo "System command executed"
          
          echo "✅ Homebrew edge case tests completed"

  # Test .phpvmrc Edge Cases  
  phpvmrc-test:
    name: .phpvmrc Edge Cases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test .phpvmrc Edge Cases
        run: |
          chmod +x ./phpvm.sh
          
          echo "=== Testing .phpvmrc Edge Cases ==="
          
          # Test with missing .phpvmrc
          mkdir test_no_phpvmrc
          cd test_no_phpvmrc
          ../phpvm.sh auto || echo "Correctly handles missing .phpvmrc"
          cd ..
          
          # Test with empty .phpvmrc
          mkdir test_empty_phpvmrc
          touch test_empty_phpvmrc/.phpvmrc
          cd test_empty_phpvmrc
          ../phpvm.sh auto || echo "Correctly handles empty .phpvmrc"
          cd ..
          
          # Test with invalid version in .phpvmrc
          mkdir test_invalid_phpvmrc
          echo "invalid.version" > test_invalid_phpvmrc/.phpvmrc
          cd test_invalid_phpvmrc
          ../phpvm.sh auto || echo "Correctly handles invalid .phpvmrc"
          cd ..
          
          # Test with whitespace in .phpvmrc
          mkdir test_whitespace_phpvmrc
          echo "  8.1  " > test_whitespace_phpvmrc/.phpvmrc
          cd test_whitespace_phpvmrc
          ../phpvm.sh auto || echo "Handles whitespace in .phpvmrc"
          cd ..
          
          echo "✅ .phpvmrc edge case tests completed"

  # Test Self-Test Robustness
  self-test-robustness:
    name: Self-Test Robustness
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Self-Tests Multiple Times
        run: |
          chmod +x ./phpvm.sh
          
          echo "=== Testing Self-Test Robustness ==="
          
          # Run self-tests multiple times to check for consistency
          for i in {1..3}; do
            echo "Self-test run #$i:"
            ./phpvm.sh test
            echo "Run #$i completed successfully"
          done
          
          echo "✅ Self-tests are robust and consistent"

  # Resource Usage Test
  resource-monitoring:
    name: Resource Usage Monitoring
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Monitor Resource Usage
        run: |
          chmod +x ./phpvm.sh
          
          echo "=== Resource Usage Monitoring ==="
          
          # Monitor memory and CPU usage during operations
          echo "Memory before:"
          free -h
          
          echo "Running phpvm operations..."
          /usr/bin/time -v ./phpvm.sh version 2>&1 | grep -E "(Maximum resident set size|User time|System time)" || true
          /usr/bin/time -v ./phpvm.sh help 2>&1 | grep -E "(Maximum resident set size|User time|System time)" || true
          /usr/bin/time -v ./phpvm.sh list 2>&1 | grep -E "(Maximum resident set size|User time|System time)" || true
          
          echo "Memory after:"
          free -h
          
          echo "✅ Resource usage monitoring completed"
