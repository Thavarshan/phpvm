name: Comprehensive PHPVM Tests

on:
  push:
    branches: [main, development, 'fix/**', 'feature/**']
  pull_request:
    branches: [main, development]
  workflow_dispatch:
  schedule:
    # Run weekly to catch any regressions
    - cron: '0 2 * * 0'

jobs:
  # Syntax and Basic Validation
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Shell Syntax Check
        run: |
          bash -n phpvm.sh
          echo "✅ Shell syntax check passed"

      - name: ShellCheck Analysis
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          format: gcc
          severity: warning
        continue-on-error: true

  # Comprehensive Testing on Multiple Platforms
  comprehensive-test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: syntax-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-20.04, macos-latest, macos-12]
        include:
          - os: ubuntu-latest
            package_manager: apt
          - os: ubuntu-20.04 
            package_manager: apt
          - os: macos-latest
            package_manager: brew
          - os: macos-12
            package_manager: brew

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment Info
        run: |
          echo "OS: $(uname -s)"
          echo "Architecture: $(uname -m)"
          echo "Shell: $SHELL"
          echo "User: $(whoami)"
          echo "Working Directory: $(pwd)"

      # macOS specific setup
      - name: Setup Homebrew (macOS)
        if: matrix.package_manager == 'brew'
        run: |
          # Homebrew is pre-installed on macOS runners
          brew --version
          echo "Homebrew is ready"

      # Linux specific setup  
      - name: Setup Homebrew (Linux)
        if: matrix.package_manager == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file git
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> ~/.bashrc
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew --version

      - name: Make Script Executable
        run: chmod +x ./phpvm.sh

      # Test all version commands
      - name: Test Version Commands
        run: |
          echo "=== Testing Version Commands ==="
          ./phpvm.sh version
          echo ""
          ./phpvm.sh --version  
          echo ""
          ./phpvm.sh -v
          echo "✅ All version commands work"

      # Test help command
      - name: Test Help Command
        run: |
          echo "=== Testing Help Command ==="
          ./phpvm.sh help
          echo "✅ Help command works"

      # Test list command (before installing anything)
      - name: Test List Command (Initial)
        run: |
          echo "=== Testing Initial List Command ==="
          ./phpvm.sh list || echo "List command executed (may show no versions)"
          echo "✅ List command works"

      # Test integrated self-tests
      - name: Run Integrated Self-Tests
        run: |
          echo "=== Running Integrated Self-Tests ==="
          ./phpvm.sh test
          echo "✅ Self-tests completed"

      # Test PHP installation
      - name: Test PHP Installation
        run: |
          echo "=== Testing PHP Installation ==="
          if [[ "${{ matrix.package_manager }}" == "brew" ]]; then
            # On macOS/Homebrew, try to install a specific version
            ./phpvm.sh install 8.3 || echo "PHP 8.3 installation attempted"
          else
            # On Linux, install system PHP first to have something to work with
            sudo apt-get install -y php-cli || echo "System PHP installation attempted"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            ./phpvm.sh install 8.3 || echo "PHP 8.3 installation attempted"
          fi
          echo "✅ PHP installation test completed"

      # Test list after installation
      - name: Test List Command (After Installation)  
        run: |
          echo "=== Testing List Command After Installation ==="
          if [[ "${{ matrix.package_manager }}" == "brew" ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" 2>/dev/null || true
          fi
          ./phpvm.sh list
          echo "✅ List command works after installation"

      # Test version switching
      - name: Test Version Switching
        run: |
          echo "=== Testing Version Switching ==="
          if [[ "${{ matrix.package_manager }}" == "brew" ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" 2>/dev/null || true
          fi
          
          # Test system switch
          ./phpvm.sh system || echo "System switch attempted"
          
          # Try to switch to installed version if available
          if ./phpvm.sh list | grep -q "8.3"; then
            ./phpvm.sh use 8.3 || echo "Switch to 8.3 attempted"
          fi
          
          echo "✅ Version switching test completed"

      # Test .phpvmrc functionality
      - name: Test Auto-Switch with .phpvmrc
        run: |
          echo "=== Testing .phpvmrc Auto-Switch ==="
          mkdir -p test_project
          echo "8.3" > test_project/.phpvmrc
          
          cd test_project
          if [[ "${{ matrix.package_manager }}" == "brew" ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" 2>/dev/null || true
          fi
          
          ../phpvm.sh auto || echo "Auto-switch attempted"
          cd ..
          echo "✅ Auto-switch test completed"

      # Test error handling
      - name: Test Error Handling
        run: |
          echo "=== Testing Error Handling ==="
          
          # Test invalid version
          ./phpvm.sh use 999.999 && exit 1 || echo "✅ Correctly handles invalid version"
          
          # Test invalid command
          ./phpvm.sh invalid_command && exit 1 || echo "✅ Correctly handles invalid command"
          
          echo "✅ Error handling tests completed"

      # Final verification
      - name: Final System Verification
        run: |
          echo "=== Final System Verification ==="
          echo "Current PHP version (if available):"
          php --version 2>/dev/null || echo "No PHP currently active"
          
          echo "PHPVM status:"
          ./phpvm.sh list
          
          echo "✅ All tests completed successfully"

  # Test Installation Script
  installation-test:
    name: Test Installation Script
    runs-on: ${{ matrix.os }}
    needs: syntax-check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Installation Script Syntax
        run: |
          if [ -f install.sh ]; then
            bash -n install.sh
            echo "✅ Installation script syntax check passed"
          else
            echo "⚠️  No install.sh found, skipping"
          fi

      - name: Test Installation Script (Dry Run)
        run: |
          if [ -f install.sh ]; then
            # Create a modified version for testing
            sed 's/curl -o-/echo "Would download:"/' install.sh > install-test.sh
            bash install-test.sh || echo "Installation script test completed"
          fi

  # Test on Different Shells
  shell-compatibility:
    name: Shell Compatibility Test
    runs-on: ubuntu-latest
    needs: syntax-check

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Additional Shells
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh dash

      - name: Test with Bash
        run: |
          chmod +x ./phpvm.sh
          bash ./phpvm.sh version
          echo "✅ Works with Bash"

      - name: Test with Zsh  
        run: |
          zsh ./phpvm.sh version
          echo "✅ Works with Zsh"

      - name: Test with Dash (POSIX)
        run: |
          # Note: phpvm now uses bash shebang, so this tests compatibility
          dash -c './phpvm.sh version' || echo "Expected: Dash may not fully support bash features"

  # Performance and Resource Tests
  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: syntax-check

    steps:
      - name: Checkout Repository  
        uses: actions/checkout@v4

      - name: Performance Benchmark
        run: |
          chmod +x ./phpvm.sh
          
          echo "=== Performance Benchmarks ==="
          
          # Test command execution speed
          time ./phpvm.sh version
          time ./phpvm.sh help
          time ./phpvm.sh list
          
          echo "✅ Performance tests completed"

      - name: Memory Usage Test
        run: |
          echo "=== Memory Usage Test ==="
          
          # Check memory usage during execution
          /usr/bin/time -v ./phpvm.sh test 2>&1 | grep "Maximum resident set size" || echo "Memory test attempted"
          
          echo "✅ Memory usage test completed"

  # Summary Job
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [syntax-check, comprehensive-test, installation-test, shell-compatibility, performance-test]
    if: always()

    steps:
      - name: Test Results Summary
        run: |
          echo "=== PHPVM Test Suite Summary ==="
          echo "Syntax Check: ${{ needs.syntax-check.result }}"
          echo "Comprehensive Tests: ${{ needs.comprehensive-test.result }}"
          echo "Installation Tests: ${{ needs.installation-test.result }}"
          echo "Shell Compatibility: ${{ needs.shell-compatibility.result }}"  
          echo "Performance Tests: ${{ needs.performance-test.result }}"
          
          if [[ "${{ needs.syntax-check.result }}" == "success" && 
                "${{ needs.comprehensive-test.result }}" == "success" ]]; then
            echo "🎉 Core functionality tests PASSED!"
          else
            echo "❌ Some tests FAILED - please review"
            exit 1
          fi
