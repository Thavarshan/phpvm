name: Release preparation

on:
  pull_request:
    branches: [main]
  push:
    tags: ['1.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to prepare (for example 1.13.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  session-smoke:
    name: Real PHP session smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
      - name: Install Homebrew PHP versions
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y zsh
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi
          brew install php@8.2 php@8.3
      - name: Verify independent PHP selections in sourced shells
        run: |
          set -euo pipefail
          bash tests/session_smoke.sh

  prepare-release:
    runs-on: ubuntu-latest
    needs: session-smoke
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out the requested release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref_name }}

      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck zsh
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64 -o /tmp/shfmt
          chmod +x /tmp/shfmt
          sudo install /tmp/shfmt /usr/local/bin/shfmt

      - name: Validate release metadata and shell syntax
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          script_version=$(sed -n 's/^PHPVM_VERSION="\([0-9.]*\)"$/\1/p' phpvm.sh | head -n 1)
          [[ "$script_version" == "$RELEASE_VERSION" ]]
          grep -q "^## \[v${RELEASE_VERSION}\]" CHANGELOG.md
          for path in phpvm.sh install.sh README.md CHANGELOG.md LICENSE completions/phpvm.bash; do
            test -s "$path"
          done
          bash -n phpvm.sh install.sh completions/phpvm.bash
          zsh -n phpvm.sh

      - name: Run tests, lint, and formatting checks
        run: |
          set -euo pipefail
          bats tests/
          shellcheck phpvm.sh install.sh
          shfmt -d -i 4 -sr phpvm.sh install.sh

      - name: Package release bundle and checksum
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/completions
          cp phpvm.sh install.sh README.md CHANGELOG.md LICENSE dist/
          cp completions/phpvm.bash dist/completions/
          tar -czf phpvm-release.tar.gz -C dist .
          sha256sum phpvm-release.tar.gz > phpvm-release.tar.gz.sha256

      - name: Create draft GitHub release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          awk -v heading="## [v${RELEASE_VERSION}]" '
            index($0, heading) == 1 { if (found) exit; found=1 }
            found { if (index($0, "## [") == 1 && index($0, heading) != 1) exit; print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            release_is_draft=$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)
            if [ "$release_is_draft" != true ]; then
              echo "Refusing to change an already published release."
              exit 1
            fi
            gh release edit "$RELEASE_VERSION" --title "v${RELEASE_VERSION}" --notes-file release-notes.md
            gh release upload "$RELEASE_VERSION" phpvm-release.tar.gz phpvm-release.tar.gz.sha256 --clobber
          else
            gh release create "$RELEASE_VERSION" \
              --draft \
              --verify-tag \
              --title "v${RELEASE_VERSION}" \
              --notes-file release-notes.md \
              phpvm-release.tar.gz phpvm-release.tar.gz.sha256
          fi
